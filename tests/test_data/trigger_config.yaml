# Sample SMORES configuration
# TODO: Where to specific data sharing behavior

simulation:
    experiment_name: test_experiment
    num_days: 10
    num_cycles: 10
    slate_size: 5
    seed: 20250513

data:
  directory: data/raw/ambar
  consumer_file: users.csv
  item_file: items.csv
  provider_file: artists.csv

consumer:
  initial_recommender_assignment:
    class_name: fixed
    name: Generic
  models:
      utility:
        - name: "Fixed utility 0.5"
          class_name: fixed_utility
          params:
            value: 0.5
        - name: "Fixed utility 0.3"
          class_name: fixed_utility
          params:
            value: 0.3
      item_selection:
        - name: "Category Similarity"
          class_name: category_similarity_logit
          params:
            threshold: 0.3        
  types:
    - name: "Generic"
      utility_model: "Fixed utility 0.5"
      item_selection_model: "Category Similarity"
      recommender_choice_model:
        class_name: fixed
        params:
          recommender_name: Generic

    - name: "Niche"
      utility_model: "Fixed utility 0.3"
      item_selection_model: "Category Similarity"
      recommender_choice_model:
        class_name: fixed
        params:
          recommender_name: Generic


provider:
  utility_model:
    class_name: click_fixed
    params:
      value: 1

platform:
  utility_model:
    class_name: null_model

recommender:
  initial: ["Generic"]
  definitions:
    - name: "Generic"
      class_name: item_knn
      params:
        max_neighbors: 20
        min_neighbors: 2
        min_similarity: 0.0001
        min_user_count: 20
        min_interaction_count: 500
        min_profile_size: 5
        cold_user_fallback: "Popular Fallback"

    - name: "Popular Fallback"
      class_name: popular
      params:
          min_user_count: 20
          min_interaction_count: 500

    - name: "Popular Niche"
      class_name: popular
      params:
          min_user_count: 20
          min_interaction_count: 500

triggers:
  - name: Cycle5Freeze
    class_name: initial_burnin
    params:
      cycle_count: 5
      recommenders: ["Generic", "Popular Niche"]
  - name: ColdStart
    class_name: cold_start_memory
    params:
      cycle_count: 1
      repeating: True


